<title>Second Brain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-screen night sky. Header and search top-left, a section rail under it opening a left panel (notes, today, ask), the detail drawer on the right, and a capture bar docked bottom-center like a spotlight. Phones stack these as sheets. Deliberately dark-only: it's a galaxy. */
:root {
  color-scheme: dark;
  --space: #04050c;
  --panel: rgba(13, 15, 30, 0.86);
  --panel-solid: #0d0f1e;
  --ink: #e8eaf6;
  --soft: #c9cde4;
  --muted: #8b91b0;
  --line: rgba(190, 200, 255, 0.14);
  --hover: rgba(160, 180, 255, 0.1);
  --focus: #9fb4ff;
  --projects: #ffb86b;
  --skills: #6ff0c2;
  --tools: #7aa7ff;
  --lessons: #e08bff;
  --prefs: #ff7c9d;
  --research: #5fd6ff;
  --ideas: #f3ee9a;
  --font-display: "Syne", "Avenir Next", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--space); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
#stage.hovering { cursor: pointer; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -150%); white-space: nowrap; font-size: 12px; color: var(--ink); text-shadow: 0 0 6px #000, 0 0 2px #000; opacity: .9; will-change: transform; }
.lbl.hub { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.lbl.sel { font-weight: 600; font-size: 14px; opacity: 1; }
.glass { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

.hud { position: fixed; z-index: 5; }
.top { top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; width: min(340px, calc(100vw - 32px)); }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 4vw, 34px); line-height: 1; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.brand .num { font-family: var(--font-mono); color: var(--ink); }
.search { position: relative; }
.search input { width: 100%; border-radius: 10px; padding: 9px 12px 9px 34px; }
.search svg { position: absolute; z-index: 1; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
.results { position: absolute; z-index: 8; left: 0; right: 0; list-style: none; margin: 6px 0 0; padding: 4px; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; max-height: 300px; overflow-y: auto; }
.results button, .row-btn { width: 100%; display: flex; gap: 8px; align-items: center; border: 0; background: none; padding: 7px 9px; border-radius: 7px; text-align: left; min-width: 0; }
.results button:hover, .results button[aria-selected="true"], .row-btn:hover { background: var(--hover); }
.results small, .row-btn small { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; padding-left: 8px; }
.row-btn .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }

.rail { display: flex; gap: 4px; padding: 4px; border-radius: 12px; }
.rail button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: none; border-radius: 9px; padding: 7px 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.rail button svg { width: 15px; height: 15px; }
.rail button:hover { color: var(--ink); background: var(--hover); }
.rail button[aria-pressed="true"] { background: var(--ink); color: var(--space); font-weight: 600; }

.panel { position: fixed; z-index: 4; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(226px + env(safe-area-inset-top, 0px)); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); width: min(340px, calc(100vw - 32px)); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
.panel-head { padding: 14px 16px 8px; display: grid; gap: 8px; }
.panel-head h2 { margin: 0; font-family: var(--font-display); font-size: 20px; }
.panel-head p { margin: 0; color: var(--muted); font-size: 13px; }
.panel-body { padding: 4px 8px 12px; overflow-y: auto; display: grid; gap: 2px; align-content: start; flex: 1; }
.filters { display: flex; flex-wrap: wrap; gap: 4px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 2px 9px 2px 7px; font-size: 12px; color: var(--soft); }
.fchip[aria-pressed="false"] { opacity: .4; }
.fchip .dot { width: 7px; height: 7px; }
.sub { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 9px 4px; }
.emptytxt { color: var(--muted); padding: 10px 9px; font-size: 13px; }
.today-date { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.chat { display: flex; flex-direction: column; gap: 10px; padding: 4px 12px 12px; overflow-y: auto; flex: 1; }
.msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.me { align-self: flex-end; background: var(--ink); color: var(--space); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: rgba(160, 180, 255, .08); border: 1px solid var(--line); border-bottom-left-radius: 4px; color: var(--soft); }
.msg.ai.err { border-color: rgba(255, 124, 157, .4); }
.msg .ref { border: 0; background: rgba(95, 214, 255, .14); color: var(--research); padding: 0 5px; border-radius: 4px; font-size: .95em; }
.msg-actions { display: flex; gap: 10px; margin-top: 6px; white-space: normal; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--focus); font-size: 12px; }
.suggest { display: grid; gap: 6px; padding: 4px 12px; }
.suggest button { text-align: left; border: 1px solid var(--line); background: none; border-radius: 10px; padding: 8px 11px; color: var(--soft); font-size: 13px; }
.suggest button:hover { border-color: var(--research); color: var(--ink); }

.legend { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 1px; border-radius: 12px; padding: 6px; }
.legend button { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 4px 8px; border-radius: 7px; text-align: left; font-size: 13px; }
.legend button:hover { background: var(--hover); }
.legend button[aria-pressed="false"] { opacity: .4; }
.legend .n { margin-left: auto; padding-left: 14px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.actions { right: max(16px, env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 8px 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); white-space: nowrap; }
.btn:hover { border-color: rgba(190, 200, 255, .35); }
.btn[aria-pressed="true"] { border-color: var(--research); color: var(--research); }
.btn.primary { background: var(--ink); color: var(--space); border-color: var(--ink); font-weight: 600; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn svg { width: 15px; height: 15px; }

.capture { left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(640px, calc(100vw - 32px)); border-radius: 16px; padding: 8px; display: grid; gap: 6px; z-index: 7; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
.capture-row { display: flex; gap: 8px; align-items: flex-end; }
.capture textarea { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; padding: 8px 6px; max-height: 140px; outline: none; line-height: 1.45; font-size: 15px; }
.capture textarea::placeholder { color: var(--muted); }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex: none; }
.modes button { border: 0; background: none; padding: 6px 10px; font-size: 12px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--hover); color: var(--ink); font-weight: 600; }
.send { width: 38px; height: 38px; border-radius: 10px; border: 0; background: var(--ink); color: var(--space); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .4; cursor: default; }
.send svg { width: 17px; height: 17px; }
.capture-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 4px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.mic-tip { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12px; display: inline-flex; gap: 5px; align-items: center; }
.mic-tip:hover { color: var(--ink); }
.mic-tip svg { width: 14px; height: 14px; }

.drawer { position: fixed; z-index: 6; top: calc(70px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 32px)); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; gap: 10px; }
.kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--c); }
.x { border: 0; background: none; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.x:hover { background: var(--hover); color: var(--ink); }
.x svg { width: 16px; height: 16px; }
.drawer-body { padding: 8px 16px 18px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.drawer h2 { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.drawer p { margin: 0; color: var(--soft); overflow-wrap: anywhere; white-space: pre-wrap; }
.drawer ul.det { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--soft); }
.drawer code { font-family: var(--font-mono); font-size: 12px; background: var(--hover); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.edit-title { font-family: var(--font-display); font-weight: 700; font-size: 24px; background: transparent; border: 0; border-bottom: 1px dashed var(--line); padding: 2px 0 6px; width: 100%; outline: none; }
.edit-title:focus { border-bottom-color: var(--focus); }
.edit-body { min-height: 150px; resize: vertical; width: 100%; background: rgba(160, 180, 255, .05); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; line-height: 1.55; color: var(--soft); }
.meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.sec { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: rgba(160, 180, 255, .05); border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 13px; max-width: 100%; }
.chip span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { border-color: var(--c); }
.chip .dot { width: 7px; height: 7px; }
.chip .rm { border: 0; background: none; padding: 0 0 0 2px; color: var(--muted); font-size: 14px; line-height: 1; }
.tag { font-family: var(--font-mono); font-size: 12px; color: var(--research); background: rgba(95, 214, 255, .1); border-radius: 5px; padding: 1px 6px; }
.extlink { color: var(--focus); }
.danger { border: 0; background: none; color: var(--prefs); padding: 0; font-size: 13px; justify-self: start; }
.input { width: 100%; background: rgba(160, 180, 255, .06); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.toolrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spark { color: var(--research); }

.scrim { position: fixed; inset: 0; z-index: 10; background: rgba(2, 3, 8, .6); display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(460px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-size: 22px; }
.sheet p { margin: 0; color: var(--soft); }
.sheet ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--soft); }
.pick { max-height: 240px; overflow-y: auto; border: 1px solid var(--line); border-radius: 9px; padding: 4px; display: grid; }
.toast { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(120px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--space); padding: 9px 15px; border-radius: 9px; font-size: 13px; font-weight: 500; max-width: calc(100% - 32px); }
.hint { left: 50%; transform: translateX(-50%); top: calc(18px + env(safe-area-inset-top, 0px)); color: var(--muted); font-size: 12px; padding: 6px 12px; border-radius: 999px; transition: opacity 1s; pointer-events: none; white-space: nowrap; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

@media (max-width: 1100px) { .legend { display: none; } .hint { display: none; } }
@media (max-width: 760px) {
  .actions .btn span.lab { display: none; }
  .brand { padding-right: 100px; }
  .brand h1 { font-size: 26px; }
  .panel { top: auto; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; height: 52vh; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
  .drawer { top: auto; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; height: 56vh; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); z-index: 8; }
  .capture { width: calc(100vw - 24px); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .capture-foot .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>

<div id="stage" aria-label="3D map of your second brain. Use search or the Notes panel to reach any item."></div>
<div id="labels" aria-hidden="true"></div>

<header class="hud top">
  <div class="brand">
    <h1>Second Brain</h1>
    <p><span class="num" id="count-nodes">0</span> stars · <span class="num" id="count-links">0</span> links · <span id="sync">connecting…</span></p>
  </div>
  <div class="search">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
    <input id="q" class="glass" type="search" placeholder="Find anything in your brain…" aria-label="Search your second brain" autocomplete="off">
    <ul class="results" id="results" role="listbox" hidden></ul>
  </div>
  <nav class="rail glass" id="rail" aria-label="Sections"></nav>
</header>

<section class="panel glass" id="panel" hidden></section>
<nav class="hud legend glass" id="legend" aria-label="Clusters"></nav>

<div class="hud actions">
  <button class="btn" type="button" id="speak-btn" aria-pressed="false" title="Read answers out loud"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6v4h2.5l3.5 3V3L5 6z"/><path d="M11 5.5a3.5 3.5 0 010 5M12.8 3.8a6 6 0 010 8.4"/></svg><span class="lab">Read aloud</span></button>
  <button class="btn" type="button" id="labels-btn" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h7M2.5 12h9"/></svg><span class="lab">All labels</span></button>
</div>

<div class="hud hint glass" id="hint">Drag to orbit · scroll to zoom · click a star</div>

<form class="hud capture glass" id="capture" autocomplete="off">
  <div class="capture-row">
    <textarea id="cap-text" rows="1" maxlength="4000" placeholder="Tell your brain anything…" aria-label="Capture a note or ask a question"></textarea>
    <div class="modes" role="group" aria-label="What to do">
      <button type="button" data-mode="note" aria-pressed="true">Save</button>
      <button type="button" data-mode="ask" aria-pressed="false">Ask</button>
    </div>
    <button class="send" type="submit" id="cap-send" aria-label="Send" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg></button>
  </div>
  <div class="capture-foot">
    <button type="button" class="mic-tip" id="mic-tip"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3 7.5a5 5 0 0010 0M8 12.5v2"/></svg>Talk instead of typing</button>
    <span id="cap-hint"><span class="hide-sm">Enter to send · Shift+Enter for a new line · </span>Save files it with AI</span>
  </div>
</form>

<aside class="drawer glass" id="drawer" hidden aria-live="polite"></aside>
<div class="scrim" id="modal" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

Rules: up to 4 lowercase tags; link only to existing ids that are clearly related (0 to 4); keep the user's meaning, don't invent facts.`;
    try {
      const r = await ai.json(prompt, { modelTier: "quick" });
      const valid = new Set(nodes.map(n => n.id));
      const patch = {};
      if (r && typeof r.title === "string" && r.title.trim()) patch.title = r.title.trim().slice(0, 100);
      if (r && CLUSTERS[r.cluster]) patch.cluster = r.cluster;
      if (r && Array.isArray(r.tags)) patch.tags = r.tags.map(t => String(t).toLowerCase().replace(/[^a-z0-9À-ɏ-]/g, "")).filter(Boolean).slice(0, 4);
      if (r && Array.isArray(r.links)) patch.links = [...new Set([...(userNodes[id]?.links || []), ...r.links.map(String).filter(x => valid.has(x) && x !== id)])].slice(0, 12);
      if (userNodes[id]) { patchThought(id, patch); if (btn) toast("Tidied and linked"); else toast(`Filed under ${CLUSTERS[patch.cluster || "ideas"].name}${patch.links && patch.links.length ? ` · ${patch.links.length} link${patch.links.length === 1 ? "" : "s"}` : ""}`); }
    } catch (e) { aiError(e); }
    if (btn && btn.isConnected) { btn.disabled = false; btn.lastChild.textContent = "Tidy & link with AI"; }
  }
  function aiError(e) {
    const code = e && e.code;
    if (code === "not_granted" || code === "sampling_disabled") { ai = null; setMode(capMode); drawDrawer(true); toast("Claude isn't allowed for this page, so notes are saved without AI."); }
    else if (code === "rate_limited") toast("Claude is busy right now. Try again in a minute.");
    else if (code !== "cancelled") toast("Claude couldn't answer that time. Try again.");
  }

  // ----- Ask -----
  let chat = [], chatBox = null, busy = false, abortCtl = null;
  function buildAsk(p) {
    chatBox = el("div", { class: "chat", id: "chat", "aria-live": "polite" });
    p.replaceChildren(el("div", { class: "panel-head" }, el("h2", { text: "Ask" }), el("p", { text: "Claude answers using your notes, plus what it knows. It can't browse the live web from here." })), chatBox);
    drawChat();
  }
  function drawChat() {
    if (!chatBox) return;
    if (!chat.length) {
      chatBox.replaceChildren(ai ? el("div", { class: "suggest" }, ["What have I learned about APIs so far?", "Explain MCP servers like I'm 10", "What should I learn next to build apps?", "Summarize my notes from today"].map(t => el("button", { type: "button", text: t, onclick: () => ask(t) })))
        : el("div", { class: "emptytxt", text: "Ask needs permission to use Claude. Open this page's menu → Permissions to allow it, then reload." }));
      return;
    }
    chatBox.replaceChildren(...chat.map((m, i) => m.role === "user" ? el("div", { class: "msg me", text: m.content }) : aiBubble(m, i)));
    chatBox.scrollTop = chatBox.scrollHeight;
  }
  function aiBubble(m, i) {
    const b = el("div", { class: "msg ai" + (m.err ? " err" : "") });
    const parts = String(m.content || (m.pending ? "Thinking…" : "")).split(/(\[\[[^\]]+\]\])/g);
    parts.forEach(part => {
      const mm = part.match(/^\[\[([^\]]+)\]\]$/);
      if (mm) { const target = nodes.find(n => !n.hub && n.t.toLowerCase() === mm[1].trim().toLowerCase()); b.append(target ? el("button", { type: "button", class: "ref", text: target.t, onclick: () => select(target.id) }) : mm[1]); }
      else b.append(part);
    });
    if (!m.pending && !m.err && m.content) b.append(el("div", { class: "msg-actions" },
      el("button", { type: "button", class: "linkbtn", text: m.saved ? "Saved ✓" : "Save to brain", disabled: m.saved, onclick: () => saveAnswer(i) }),
      canSpeak ? el("button", { type: "button", class: "linkbtn", text: "Read aloud", onclick: () => { const was = speakOn; speakOn = true; speak(m.content); speakOn = was; } }) : null));
    return b;
  }
  function contextFor(question) {
    const words = question.toLowerCase().match(/[a-z0-9À-ɏ]{3,}/g) || [];
    const scored = nodes.filter(n => !n.hub).map(n => {
      const hay = (n.t + " " + stripHtml(n.s) + " " + stripHtml((n.x || []).join(" ")) + " " + (n.tags || []).join(" ")).toLowerCase();
      let s = words.reduce((a, w) => a + (hay.includes(w) ? (n.t.toLowerCase().includes(w) ? 3 : 1) : 0), 0);
      if (n.user) s += .5; if (n.d === dayKey() && /today|vandaag|aujourd/.test(question.toLowerCase())) s += 5;
      return { n, s };
    }).sort((a, b) => b.s - a.s);
    const picked = scored.filter(x => x.s > 0).slice(0, 18).map(x => x.n);
    const fill = picked.length < 8 ? scored.slice(0, 8).map(x => x.n) : [];
    return [...new Set([...picked, ...fill])].map(n => `- [[${n.t}]] (${CLUSTERS[n.c].name}${n.d ? ", " + n.d : ""}): ${stripHtml(n.s).slice(0, 600)}${n.x && n.x.length ? " · " + stripHtml(n.x.join("; ")).slice(0, 300) : ""}`).join("\n");
  }
  async function ask(question) {
    if (!ai) { toast("Ask needs permission to use Claude for this page."); return; }
    if (busy) { abortCtl && abortCtl.abort(); }
    if (!chatBox) setPanel("ask");
    chat.push({ role: "user", content: question });
    const msg = { role: "assistant", content: "", pending: true, q: question }; chat.push(msg); drawChat();
    busy = true; abortCtl = new AbortController();
    const system = `You are the assistant inside the user's "Second Brain" app. The user is a total beginner learning AI and coding: explain simply, define jargon, be warm and brief (under 180 words unless they ask for more). Use their notes below when relevant and cite them as [[Exact Title]]. If the notes don't cover it, answer from your general knowledge and say so. You can't browse the live web; for current events or prices, say what to search for. Reply in the language the user writes in.

THEIR NOTES (most relevant first):
${contextFor(question)}`;
    const turns = chat.filter(m => !m.err && (m.role === "user" || (m.content && !m.pending))).slice(-9).map(m => ({ role: m.role, content: m.content }));
    while (turns.length && turns[0].role !== "user") turns.shift();
    const lastIdx = turns.length - 1; turns[lastIdx] = { role: "user", content: system + "\n\nQUESTION: " + turns[lastIdx].content };
    try {
      const r = await ai(turns, { signal: abortCtl.signal, cache: false, onText: u => { msg.content = u.text; msg.pending = false; drawChat(); } });
      msg.content = r.text; msg.pending = false; drawChat(); speak(r.text);
    } catch (e) {
      msg.pending = false;
      if (e && e.code === "cancelled") { msg.content = msg.content || "(stopped)"; }
      else { msg.err = true; msg.content = e && e.text ? e.text : (e && e.code === "rate_limited" ? "Claude is busy right now. Try again in a minute." : "Claude couldn't answer that time. Try asking again."); aiError(e); }
      drawChat();
    }
    busy = false;
  }
  function saveAnswer(i) {
    const m = chat[i]; if (!m || m.saved) return;
    const refs = [...m.content.matchAll(/\[\[([^\]]+)\]\]/g)].map(x => nodes.find(n => !n.hub && n.t.toLowerCase() === x[1].trim().toLowerCase())).filter(Boolean).map(n => n.id);
    const id = uid(); let title = (m.q || "Answer").trim(); if (title.length > 70) title = title.slice(0, 67) + "…";
    saveThought(id, { title, note: m.content.replace(/\[\[([^\]]+)\]\]/g, "$1"), cluster: "research", links: [...new Set(refs)].slice(0, 10), tags: [], createdAt: Date.now(), updatedAt: Date.now(), source: "ask" });
    m.saved = true; drawChat(); toast("Answer saved as a Research star");
  }
  function askAbout(n) { setPanel("ask"); ask(`Explain "${n.t}" to me simply, and how it connects to the rest of what I've learned.`); }

  // ================= storage (private per person, falls back to this browser) =================
  let col = null, mode = "wait";
  function setSync(t) { $("#sync").textContent = t; }
  function refresh() {
    const keep = selected; buildGraph(); rebuildScene(); drawLegend();
    selected = keep && byId.has(keep) ? keep : null; applyVisibility(); drawDrawer(false);
    if (panel === "notes" || panel === "today") { const f = document.activeElement; if (!(f && f.id === "nf-q")) drawPanel(); }
  }
  function goLocal() { if (mode !== "wait") return; mode = "local"; userNodes = ls.get("sb.local", {}); setSync("saved in this browser"); refresh(); }
  async function connect() {
    if (!window.claude || typeof window.claude.use !== "function") return goLocal();
    try {
      const [db, user, smp] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("sample")]);
      if (smp) { ai = smp; setMode(capMode); drawChat(); drawDrawer(true); }
      const id = user ? await user.id() : null;
      if (!db || !id) return goLocal();
      col = db.collection(`data/users/${id}/thoughts`); mode = "cloud"; setSync("saved to your account");
      col.onSnapshot(snap => { const next = {}; snap.docs.forEach(d => next[d.id] = { ...d.data() }); userNodes = next; refresh(); }, () => setSync("offline"));
    } catch { goLocal(); }
  }
  const persistLocal = () => { if (!col) ls.set("sb.local", userNodes); };
  function saveThought(id, data) {
    userNodes[id] = data; refresh();
    if (col) col.doc(id).set(data).catch(() => toast("Couldn't save that note. Check your connection and try again.")); else persistLocal();
  }
  function patchThought(id, patch) {
    if (!userNodes[id]) return;
    patch = { ...patch, updatedAt: Date.now() };
    userNodes[id] = { ...userNodes[id], ...patch }; refresh();
    if (col) col.doc(id).update(patch).catch(() => toast("Couldn't save that change. Try again.")); else persistLocal();
  }
  function removeThought(id) {
    delete userNodes[id];
    Object.entries(userNodes).forEach(([k, u]) => { if ((u.links || []).includes(id)) { u.links = u.links.filter(x => x !== id); if (col) col.doc(k).update({ links: u.links }).catch(() => {}); } });
    select(null); refresh(); toast("Note deleted");
    if (col) col.doc(id).delete().catch(() => toast("Couldn't delete that note. Try again.")); else persistLocal();
  }

  // ================= boot =================
  buildGraph(); rebuildScene(); drawLegend(); drawRail(); drawPanel(); setMode("note");
  requestAnimationFrame(frame);
  connect();
  setTimeout(goLocal, 11000);
})();
</script>
