<title>Daybook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Layout: a workspace. Fixed sidebar of sections and pages on the left, one wide work surface on the right; on phones the sidebar becomes a scrolling tab bar on top. */
:root {
  --bg: #f4f6f2;
  --side: #e8ece6;
  --surface: #ffffff;
  --ink: #17251f;
  --muted: #5d6c65;
  --line: #d6ddd7;
  --hover: #dfe5de;
  --accent: #2c4fd0;
  --accent-soft: #e1e7fc;
  --mark: #f2c94c;
  --must: #c2410c;
  --should: #2c4fd0;
  --could: #6b7f76;
  --good: #1f7a4d;
  --warn: #b45309;
  --danger: #b42318;
  --ev-blue: #2c4fd0; --ev-green: #1f7a4d; --ev-orange: #c2560c; --ev-purple: #7140c4; --ev-rose: #c0306a;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a16; --side: #0d1411; --surface: #18221d; --ink: #e4ebe6; --muted: #93a39b; --line: #2b3832; --hover: #22302a;
    --accent: #8ea6ff; --accent-soft: #232d4d; --mark: #e8bf45;
    --must: #fb8a55; --should: #8ea6ff; --could: #8fa39a; --good: #5cc98f; --warn: #f0b04a; --danger: #ff7b6e;
    --ev-blue: #8ea6ff; --ev-green: #5cc98f; --ev-orange: #f59a5b; --ev-purple: #b896ff; --ev-rose: #f27ba8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a16; --side: #0d1411; --surface: #18221d; --ink: #e4ebe6; --muted: #93a39b; --line: #2b3832; --hover: #22302a;
  --accent: #8ea6ff; --accent-soft: #232d4d; --mark: #e8bf45;
  --must: #fb8a55; --should: #8ea6ff; --could: #8fa39a; --good: #5cc98f; --warn: #f0b04a; --danger: #ff7b6e;
  --ev-blue: #8ea6ff; --ev-green: #5cc98f; --ev-orange: #f59a5b; --ev-purple: #b896ff; --ev-rose: #f27ba8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.grow { flex: 1; }

/* App frame */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 16px 10px 16px max(10px, env(safe-area-inset-left, 0px)); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.side-brand { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
.side-brand b { font-family: var(--font-display); font-size: 22px; letter-spacing: -.02em; }
.search-btn { display: flex; align-items: center; gap: 8px; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; color: var(--muted); font-size: 14px; text-align: left; }
.search-btn span { white-space: nowrap; }
.search-btn kbd { margin-left: auto; white-space: nowrap; font-family: var(--font-mono); font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
nav.sections { display: grid; gap: 1px; }
.nav-item { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; border-radius: 7px; padding: 7px 10px; width: 100%; text-align: left; color: var(--ink); font-size: 14px; text-decoration: none; }
.nav-item:hover { background: var(--hover); }
.nav-item[aria-current="page"] { background: var(--surface); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.nav-item svg { width: 17px; height: 17px; flex: none; color: var(--muted); }
.nav-item .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.nav-item .count.alert { color: var(--danger); }
.side-pages { display: grid; gap: 1px; }
.side-pages .head { display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
.side-pages .nav-item { font-size: 13.5px; padding-block: 5px; }
.side-pages .nav-item .pi { width: 17px; text-align: center; flex: none; }
.side-pages .nav-item span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-foot { margin-top: auto; display: grid; gap: 8px; padding: 0 8px; }
.mini-timer { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; width: 100%; }
.mini-timer .num { font-size: 14px; color: var(--accent); }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-state="cloud"]::before { background: var(--good); }
.sync[data-state="local"]::before { background: var(--mark); }

main { min-width: 0; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1080px; margin: 0 auto; display: grid; gap: 22px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
.page-head h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 4.5vw, 40px); line-height: 1.05; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: 0; z-index: 20; height: auto; flex-direction: row; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .side-brand, .side-pages, .side-foot .sync { display: none; }
  .search-btn { width: auto; flex: none; padding: 7px; }
  .search-btn span, .search-btn kbd { display: none; }
  nav.sections { display: flex; gap: 2px; }
  .nav-item { white-space: nowrap; padding: 6px 10px; }
  .nav-item .count { display: none; }
  .side-foot { margin: 0; padding: 0; flex: none; }
  .mini-timer { padding: 6px 8px; }
  main { padding-block: 20px 48px; }
}

/* Shared pieces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.panel h2 { font-family: var(--font-display); font-weight: 500; font-size: 19px; margin: 0; letter-spacing: -.01em; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn svg { width: 15px; height: 15px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.ghost:hover { background: var(--hover); }
.btn.danger { color: var(--danger); border-color: var(--line); background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.input, select.input, textarea.input { width: 100%; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
textarea.input { resize: vertical; min-height: 70px; }
.icon-btn { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 6px; display: inline-grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 18px; color: var(--muted); display: grid; gap: 10px; justify-items: start; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.must { color: var(--must); border-color: color-mix(in srgb, var(--must) 35%, transparent); }
.chip.should { color: var(--should); border-color: color-mix(in srgb, var(--should) 35%, transparent); }
.chip.overdue { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.chip.today { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.chip.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; }
.check { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--muted); background: transparent; display: grid; place-items: center; padding: 0; flex: none; }
.check svg { width: 13px; height: 13px; opacity: 0; color: var(--surface); }
.check.on { background: var(--good); border-color: var(--good); }
.check.on svg { opacity: 1; }
.bar { height: 8px; border-radius: 999px; background: var(--hover); position: relative; overflow: visible; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent); }
.bar > i.good { background: var(--good); }
.bar > b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; opacity: .55; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 960px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

/* Home */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.stat { padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .v { font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 13px; color: var(--muted); }
@media (max-width: 720px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat:nth-child(3) { border-left: 0; } .stat:nth-child(n+3) { border-top: 1px solid var(--line); } }
.agenda { list-style: none; margin: 0; padding: 0; display: grid; }
.agenda li { display: grid; grid-template-columns: 74px auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.agenda li:last-child { border-bottom: 0; }
.cal-wrap .agenda li { grid-template-columns: 56px auto minmax(0, 1fr) auto; }
.agenda .when { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.agenda .sw { width: 4px; height: 22px; border-radius: 2px; background: var(--muted); }
.agenda .what { min-width: 0; overflow-wrap: anywhere; }
.agenda .what button { border: 0; background: none; padding: 0; text-align: left; }
.agenda .what button:hover { text-decoration: underline; }
.quick { display: flex; gap: 8px; }
.goal-mini { display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.goal-mini:last-child { border-bottom: 0; }
.goal-mini .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.goal-mini .top b { font-weight: 600; overflow-wrap: anywhere; }

/* Tasks */
form.add { display: flex; gap: 8px; flex-wrap: wrap; }
form.add .input[type="text"] { flex: 1 1 240px; }
form.add input[type="date"] { width: auto; flex: 0 0 auto; }
.group-title { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.group-title .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--muted); }
ul.tasks { list-style: none; margin: 0; padding: 0; display: grid; }
li.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px dashed var(--line); }
li.task:last-child { border-bottom: 0; }
.t-main { min-width: 0; display: grid; gap: 3px; }
.t-title { border: 0; background: none; padding: 0; text-align: left; overflow-wrap: anywhere; }
.t-title:hover { text-decoration: underline; text-decoration-color: var(--muted); }
.t-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
li.task.done .t-title { color: var(--muted); text-decoration: line-through; }
li.task.focused .t-title { background: linear-gradient(transparent 55%, color-mix(in srgb, var(--mark) 55%, transparent) 55%); }
.t-actions { display: inline-flex; gap: 2px; opacity: .55; }
li.task:hover .t-actions, li.task:focus-within .t-actions { opacity: 1; }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 760px) { .board { grid-template-columns: minmax(0, 1fr); } }
.col { background: var(--side); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; min-height: 120px; align-content: start; border: 1px solid transparent; }
.col.over { border-color: var(--accent); background: var(--accent-soft); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 6px; cursor: grab; }
.card.dragging { opacity: .4; }
.card .t-title { font-weight: 500; }
.card .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }

/* Calendar */
.cal-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 1000px) { .cal-wrap { grid-template-columns: minmax(0, 1fr); } }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-dow span { padding: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
.day { min-height: 104px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 3px; background: transparent; border-top: 0; border-left: 0; text-align: left; min-width: 0; }
.day:nth-child(7n) { border-right: 0; }
.day.out { background: var(--bg); }
.day.out .dn { color: var(--muted); opacity: .6; }
.day:hover { background: var(--hover); }
.day.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.dn { font-family: var(--font-mono); font-size: 12px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.day.today .dn { background: var(--accent); color: var(--surface); }
.ev { font-size: 12px; line-height: 1.3; padding: 2px 6px; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: color-mix(in srgb, var(--c, var(--muted)) 16%, var(--surface)); color: var(--ink); border-left: 3px solid var(--c, var(--muted)); }
.ev.task { background: transparent; border-left-style: dotted; }
.ev.task.done { text-decoration: line-through; color: var(--muted); }
.ev.goal { border-left-color: var(--mark); background: color-mix(in srgb, var(--mark) 20%, var(--surface)); }
.more { font-size: 11px; color: var(--muted); padding-left: 6px; }
.dots { display: none; gap: 3px; flex-wrap: wrap; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--muted)); }
@media (max-width: 640px) { .day { min-height: 58px; align-items: center; } .day .ev, .day .more { display: none; } .dots { display: flex; } }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; background: var(--c); padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c); }

/* Goals */
.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 400px) { .goals { grid-template-columns: minmax(0, 1fr); } }
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.goal h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 19px; line-height: 1.2; overflow-wrap: anywhere; }
.goal .why { margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.goal-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.goal-dates { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.ms { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ms li { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.ms li span { overflow-wrap: anywhere; min-width: 0; }
.ms li.on span { color: var(--muted); text-decoration: line-through; }
.goal-foot { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.ms-edit { display: grid; gap: 6px; }
.ms-edit .row { display: flex; gap: 6px; }

/* Habits */
.habit-grid { display: grid; gap: 8px; overflow-x: auto; }
.habit-row { display: grid; grid-template-columns: minmax(120px, 1fr) repeat(14, 26px) 44px; align-items: center; gap: 4px; min-width: 0; }
@media (max-width: 700px) { .habit-row { grid-template-columns: minmax(90px, 1fr) repeat(7, 26px) 40px; } .habit-row > .old { display: none; } }
.habit-row.head span { font-size: 10px; text-align: center; color: var(--muted); font-weight: 600; }
.habit-row.head span.today { color: var(--accent); }
.h-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 4px; min-width: 0; }
.h-name .icon-btn { width: 22px; height: 22px; opacity: 0; }
.habit-row:hover .h-name .icon-btn, .h-name .icon-btn:focus-visible { opacity: 1; }
.cell { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: transparent; padding: 0; }
.cell[aria-pressed="true"] { background: var(--good); border-color: var(--good); }
.cell.today { border-color: var(--accent); border-width: 1.5px; }
.streak { font-family: var(--font-mono); font-size: 12px; text-align: right; color: var(--muted); }
.streak.hot { color: var(--must); }

/* Focus */
.focus-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .focus-wrap { grid-template-columns: minmax(0, 1fr); } }
.modes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.modes button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 14px; font-size: 13px; color: var(--muted); }
.modes button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.dial { position: relative; width: min(280px, 100%); aspect-ratio: 1; max-width: 100%; margin: 4px auto; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .track { fill: none; stroke: var(--line); stroke-width: 7; }
.dial .prog { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .4s linear; }
.dial[data-mode="break"] .prog { stroke: var(--good); }
.dial .ticks line { stroke: var(--muted); stroke-width: 1; opacity: .5; }
.readout { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
.readout .time { font-family: var(--font-mono); font-size: clamp(34px, 9vw, 48px); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.readout .sub { font-size: 12px; color: var(--muted); }
.timer-ctl { display: flex; gap: 8px; justify-content: center; }
.lengths { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.field { display: grid; gap: 5px; min-width: 0; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch { position: relative; width: 40px; height: 22px; border-radius: 999px; border: 0; background: var(--line); padding: 0; flex: none; }

    const names = { home: "Home", tasks: "Tasks", calendar: "Calendar", goals: "Goals", habits: "Habits", focus: "Focus", notes: "Notes", alarms: "Alarms" };
    const draw = () => {
      const q = input.value.trim().toLowerCase();
      const all = [
        ...VIEWS.map(v => ({ ic: icon(I[v]), t: names[v], k: "Go to", act: () => go(v) })),
        { ic: icon(I.plus), t: "New task", k: "Create", act: () => editTask() },
        { ic: icon(I.plus), t: "New event", k: "Create", act: () => editEvent(null, { date: todayK() }) },
        { ic: icon(I.plus), t: "New goal", k: "Create", act: () => editGoal() },
        { ic: icon(I.plus), t: "New page", k: "Create", act: newNote },
        { ic: icon(I.plus), t: "New alarm", k: "Create", act: () => editAlarm() },
        ...list("tasks").map(t => ({ ic: icon(I.tasks), t: t.title, k: st(t) === "done" ? "Done task" : "Task", s: (t.notes || ""), act: () => editTask(t.id) })),
        ...list("notes").map(n => ({ ic: el("span", { text: n.icon || "📄" }), t: n.title || "Untitled", k: "Page", s: (n.body || "").replace(/<[^>]+>/g, " "), act: () => go("notes", { noteId: n.id }) })),
        ...list("goals").map(g => ({ ic: icon(I.goals), t: g.title, k: "Goal", s: g.why || "", act: () => editGoal(g.id) })),
        ...list("events").map(e => ({ ic: icon(I.calendar), t: e.title, k: fmtDate(e.date), s: e.notes || "", act: () => editEvent(e.id) })),
        ...list("habits").map(h => ({ ic: icon(I.habits), t: h.name, k: "Habit", act: () => go("habits") })),
        ...list("alarms").map(a => ({ ic: icon(I.alarms), t: `${fmtTime(a.time)} ${a.label || "Alarm"}`, k: "Alarm", act: () => editAlarm(a.id) }))
      ];
      results = (q ? all.filter(r => r.t.toLowerCase().includes(q) || (r.s || "").toLowerCase().includes(q)) : all.slice(0, 13)).slice(0, 30);
      idx = Math.min(idx, Math.max(0, results.length - 1));
      ul.replaceChildren(...(results.length ? results.map((r, i) => el("li", {}, el("button", { type: "button", role: "option", "aria-selected": String(i === idx), onclick: () => { closeModal(); r.act(); } }, r.ic, el("span", { class: "t", text: r.t }), el("small", { text: r.k })))) : [el("li", { class: "muted", style: "padding:12px", text: "No matches. Try another word." })]));
      ul.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest" });
    };
    input.addEventListener("input", () => { idx = 0; draw(); });
    input.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { e.preventDefault(); idx = Math.min(results.length - 1, idx + 1); draw(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); idx = Math.max(0, idx - 1); draw(); }
      else if (e.key === "Enter") { e.preventDefault(); const r = results[idx]; if (r) { closeModal(); r.act(); } }
    });
    const m = $("#modal"); modalClose = document.activeElement;
    m.replaceChildren(el("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": "Search" }, input, ul));
    m.hidden = false; draw(); setTimeout(() => input.focus(), 20);
  }
  $("#open-search").addEventListener("click", openSearch);
  $("#mini-timer").addEventListener("click", () => go("focus"));
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if ($("#modal").hidden) openSearch(); else closeModal(); }
    else if (e.key === "Escape" && !$("#modal").hidden) closeModal();
  });

  // ================= starter set =================
  function starter() {
    const now = Date.now(), tk = todayK(), d = n => dk(addDays(new Date(), n));
    const gid = uid();
    store.put("goals", gid, { title: "Launch my portfolio website", why: "Show my best work and land better clients.", area: "Career", target: d(45), status: "active", createdAt: now,
      milestones: [{ id: uid(), text: "Pick my 6 strongest projects", done: true }, { id: uid(), text: "Write case studies", done: false }, { id: uid(), text: "Design and build the site", done: false }, { id: uid(), text: "Share it with 10 people", done: false }] });
    [["Plan the three most important things for today", "must", tk, null], ["Draft the first case study", "should", d(1), gid], ["Reply to messages that need an answer", "should", tk, null], ["Book a dentist appointment", "could", d(5), null]]
      .forEach(([title, prio, due, goalId], i) => store.put("tasks", uid(), { title, prio, status: "todo", done: false, due, goalId, createdAt: now + i, focusMin: 0 }));
    store.put("events", uid(), { title: "Weekly planning", date: d(1), start: "09:00", end: "09:30", color: "purple", remind: 10, notes: "", createdAt: now });
    store.put("events", uid(), { title: "Gym", date: d(2), start: "18:00", end: "19:00", color: "green", remind: 30, notes: "", createdAt: now });
    store.put("habits", uid(), { name: "Read 20 pages", days: { [dk(daysBack(1))]: true, [dk(daysBack(2))]: true }, createdAt: now });
    store.put("habits", uid(), { name: "Drink 2L of water", days: {}, createdAt: now + 1 });
    store.put("alarms", uid(), { time: "07:00", label: "Wake up", days: [1, 2, 3, 4, 5], date: null, enabled: false, createdAt: now });
    store.put("notes", uid(), { title: "Ideas inbox", icon: "💡", createdAt: now, updatedAt: now,
      body: "<p>Drop ideas here as they come. Sort them on Fridays.</p><h2>This week</h2><ul class=\"checklist\"><li data-checked=\"\">Try writing before checking email</li><li>Sketch three logo directions</li></ul><h2>Someday</h2><ul><li>Start a newsletter</li><li>Learn to make short videos</li></ul>" });
    toast("Starter set loaded. Edit or delete anything.");
  }

  // ================= boot =================
  window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== ui.view) go(v); });
  render(true); drawTimer();
  if (timer.endsAt) { if (left() <= 0) { timer = { ...timer, endsAt: null, remaining: 0 }; saveTimer(); } else startTick(); }
  setInterval(checkAlarms, 5000);
  let lastDay = todayK(), lastMin = new Date().getMinutes();
  setInterval(() => { const m = new Date().getMinutes(); if (m !== lastMin) { lastMin = m; if (todayK() !== lastDay) { lastDay = todayK(); } if (ui.view === "home" || ui.view === "alarms") schedule(); } }, 15000);
  document.addEventListener("visibilitychange", async () => {
    if (document.hidden) return;
    checkAlarms(); drawTimer();
    if (ui.wake && !wakeLock) { try { wakeLock = await navigator.wakeLock.request("screen"); } catch {} }
  });
  connect();
  setTimeout(goLocal, 11000);
})();
</script>
