# Free automatic check: runs the app smoke test on every push and every night. No AI tokens.
name: smoke-test
on:
  push:
    paths: ["app/**", "tests/**", "systems/**", "memory/**", "content/**", "learning/**", "CLAUDE.md", ".claude/**", "tools/**"]
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # every push: Chromium only (private repos get limited free CI minutes); WebKit (iPhone engine) nightly + on demand
        browser: ${{ fromJSON(github.event_name == 'push' && '["chromium"]' || '["chromium","webkit"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/smoke.js
        env:
          BROWSER: ${{ matrix.browser }}
      - run: node tests/evals/run.js
