# Free automatic check: runs the app smoke test on every push and every night. No AI tokens.
name: smoke-test
on:
  push:
    paths: ["app/**", "tests/**"]
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tests/smoke.js
