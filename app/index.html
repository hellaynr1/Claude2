<script src="https://js.puter.com/v2/"></script>
<script>
// Web adapter: replaces the Claude-page features with free web equivalents.
// AI: Claude through Puter.js (free account, no API key). Storage: this browser. Files: normal downloads.
(function () {
  // Current Claude models on Puter (from developer.puter.com/ai/anthropic). Fast model for Talk and filing.
  const SMART = ["anthropic/claude-sonnet-5-5", "anthropic/claude-sonnet-4-5", "claude-sonnet-4-5"];
  const FAST = ["anthropic/claude-haiku-5-5", "anthropic/claude-haiku-4-5", "anthropic/claude-sonnet-5-5"];
  const working = { smart: null, fast: null };
  try { localStorage.removeItem("sb.webModel"); } catch {}
  const signedIn = () => { try { return !!(window.puter && puter.auth.isSignedIn()); } catch { return false; } };
  const textOf = r => {
    if (r == null) return "";
    if (typeof r === "string") return r;
    if (typeof r.text === "string") return r.text;
    const c = r.message && r.message.content;
    if (typeof c === "string") return c;
    if (Array.isArray(c)) return c.map(p => (p && (p.text || "")) || "").join("");
    return String(r);
  };
  async function call(messages, opts = {}) {
    if (!window.puter || !puter.ai) throw { code: "upstream_error", message: "AI script didn't load. Check your connection." };
    if (!signedIn()) throw { code: "not_signed_in", message: "Sign in to Puter first (Data → Sign in)." };
    const kind = opts.modelTier === "quick" ? "fast" : "smart";
    const base = kind === "fast" ? FAST : SMART;
    const list = [...new Set([working[kind], ...base].filter(Boolean)), null];  // null = Puter's default model
    let lastErr;
    for (const model of list) {
      if (opts.signal && opts.signal.aborted) throw { code: "cancelled" };
      try {
        const o = model ? { model } : {};
        if (opts.onText) {
          const stream = await puter.ai.chat(messages, { ...o, stream: true });
          let text = "";
          for await (const part of stream) {
            if (opts.signal && opts.signal.aborted) throw { code: "cancelled", text };
            const d = (part && (part.text || (part.delta && part.delta.text))) || "";
            if (d) { text += d; opts.onText({ text, delta: d }); }
          }
          if (!text) throw new Error("empty");
          remember(kind, model); return { text, truncated: false };
        }
        const r = await puter.ai.chat(messages, o);
        const text = textOf(r); if (!text) throw new Error("empty");
        remember(kind, model); return { text, truncated: false };
      } catch (e) {
        if (e && e.code === "cancelled") throw e;
        lastErr = e;
      }
    }
    const msg = (lastErr && (lastErr.message || (lastErr.error && lastErr.error.message))) || "";
    throw { code: /limit|quota|credit|insufficient|funds/i.test(msg) ? "rate_limited" : "upstream_error", message: msg };
  }
  function remember(kind, m) { working[kind] = m; }
  const toMessages = input => typeof input === "string" ? [{ role: "user", content: input }] : input.map(m => ({ role: m.role, content: m.content }));
  const ai = (input, opts) => call(toMessages(input), opts || {});
  ai.json = async (input, opts) => {
    const msgs = toMessages(input); msgs[msgs.length - 1] = { role: "user", content: msgs[msgs.length - 1].content + "\n\nReply with only the JSON value, no other text." };
    const { text } = await call(msgs, opts || {});
    const t = text.trim();
    const tryParse = x => { try { return JSON.parse(x); } catch { return undefined; } };
    let v = tryParse(t);
    if (v === undefined) { const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) v = tryParse(f[1]); }
    if (v === undefined) { const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]")); if (a >= 0 && b > a) v = tryParse(t.slice(a, b + 1)); }
    if (v === undefined) throw { code: "invalid_json", text };
    return v;
  };
  ai.limits = async () => ({});
  const downloads = { save: async ({ filename, data }) => {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    return { saved: true };
  } };
  const SYNC_PATH = "SecondBrain/sync.json";
  const cloud = {
    ready: () => { try { return !!(window.puter && puter.auth.isSignedIn()); } catch { return false; } },
    pull: async () => {
      try { const r = await puter.fs.read(SYNC_PATH); const t = typeof r === "string" ? r : await r.text(); return JSON.parse(t); }
      catch (e) { const m = String((e && (e.message || e.code)) || e); if (/not.?found|no such|does not exist|subject_does_not_exist|404/i.test(m)) return null; throw e; }
    },
    push: async data => { await puter.fs.write(SYNC_PATH, JSON.stringify(data), { overwrite: true, createMissingParents: true }); }
  };
  window.SBWeb = {
    ai, downloads, cloud,
    signIn: async () => { if (!window.puter) throw new Error("no puter"); if (!puter.auth.isSignedIn()) await puter.auth.signIn(); },
    signedIn,
    status: () => signedIn() ? "Connected" + (working.smart ? " · " + working.smart.replace("anthropic/", "") : "") : "Not connected yet"
  };
})();
</script>

<body>
<title>Second Brain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one full-screen night sky. Header and search top-left, a section rail under it opening a left panel (notes, today, ask), the detail drawer on the right, and a capture bar docked bottom-center like a spotlight. Phones stack these as sheets. Deliberately dark-only: it's a galaxy. */
:root {
  color-scheme: dark;
  --space: #04050c;
  --panel: rgba(12, 14, 26, 0.72);
  --panel-solid: #0d0f1e;
  --ink: #e8eaf6;
  --soft: #c9cde4;
  --muted: #8b91b0;
  --line: rgba(200, 210, 255, 0.10);
  --hover: rgba(160, 180, 255, 0.1);
  --focus: #9fb4ff;
  --projects: #ffb86b;
  --skills: #6ff0c2;
  --tools: #7aa7ff;
  --lessons: #e08bff;
  --prefs: #ff7c9d;
  --research: #5fd6ff;
  --ideas: #f3ee9a;
  --learn: #ff7a59;
  --brand: #b6f26b;
  --systems: #e6ecff;
  --font-display: "Geist", "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Geist", "SF Pro Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--space); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
#stage.hovering { cursor: pointer; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -150%); white-space: nowrap; font-size: 11.5px; letter-spacing: .01em; color: var(--ink); text-shadow: 0 0 6px #000, 0 0 2px #000; opacity: .9; will-change: transform; }
.lbl.hub { font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--c); }
.lbl.sel { font-weight: 600; font-size: 14px; opacity: 1; }
.glass { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); box-shadow: 0 8px 32px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .04); }

.hud { position: fixed; z-index: 5; }
.top { top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; width: min(392px, calc(100vw - 32px)); }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 4vw, 34px); line-height: 1; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.brand .num { font-family: var(--font-mono); color: var(--ink); }
.search { position: relative; }
.search input { width: 100%; border-radius: 10px; padding: 9px 12px 9px 34px; }
.search svg { position: absolute; z-index: 1; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
.results { position: absolute; z-index: 8; left: 0; right: 0; list-style: none; margin: 6px 0 0; padding: 4px; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; max-height: 300px; overflow-y: auto; }
.results button, .row-btn { width: 100%; display: flex; gap: 8px; align-items: center; border: 0; background: none; padding: 7px 9px; border-radius: 7px; text-align: left; min-width: 0; }
.results button:hover, .results button[aria-selected="true"], .row-btn:hover { background: var(--hover); }
.results small, .row-btn small { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; padding-left: 8px; }
.row-btn .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }

.rail { display: flex; gap: 4px; padding: 4px; border-radius: 12px; overflow-x: auto; scrollbar-width: none; }
.rail button { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: 5px; border: 0; background: none; border-radius: 9px; padding: 7px 5px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.rail button svg { width: 15px; height: 15px; }
.rail button:hover { color: var(--ink); background: var(--hover); }
.rail button[aria-pressed="true"] { background: var(--ink); color: var(--space); font-weight: 600; }

.panel { position: fixed; z-index: 4; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(126px + env(safe-area-inset-top, 0px)); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); width: min(392px, calc(100vw - 32px)); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
.panel-head { padding: 14px 16px 8px; display: grid; gap: 8px; }
.panel-head h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.panel-head p { margin: 0; color: var(--muted); font-size: 13px; }
.panel-body { padding: 4px 8px 12px; overflow-y: auto; display: grid; gap: 2px; align-content: start; flex: 1; }
.filters { display: flex; flex-wrap: wrap; gap: 4px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 2px 9px 2px 7px; font-size: 12px; color: var(--soft); }

.fchip .dot { width: 7px; height: 7px; }
.sub { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 9px 4px; }
.emptytxt { color: var(--muted); padding: 10px 9px; font-size: 13px; }
.today-date { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.chat { display: flex; flex-direction: column; gap: 10px; padding: 4px 12px 12px; overflow-y: auto; flex: 1; }
.msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.me { align-self: flex-end; background: var(--ink); color: var(--space); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: rgba(160, 180, 255, .08); border: 1px solid var(--line); border-bottom-left-radius: 4px; color: var(--soft); }
.msg.ai.err { border-color: rgba(255, 124, 157, .4); }
.msg .ref { border: 0; background: rgba(95, 214, 255, .14); color: var(--research); padding: 0 5px; border-radius: 4px; font-size: .95em; }
.msg-actions { display: flex; gap: 10px; margin-top: 6px; white-space: normal; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--focus); font-size: 12px; }
.suggest { display: grid; gap: 6px; padding: 4px 12px; }
.suggest button { text-align: left; border: 1px solid var(--line); background: none; border-radius: 10px; padding: 8px 11px; color: var(--soft); font-size: 13px; }
.suggest button:hover { border-color: var(--research); color: var(--ink); }

.legend { display: none !important; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 1px; border-radius: 12px; padding: 6px; }
.legend button { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 4px 8px; border-radius: 7px; text-align: left; font-size: 13px; }
.legend button:hover { background: var(--hover); }
.legend button[aria-pressed="false"] { opacity: .4; }
.legend .n { margin-left: auto; padding-left: 14px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.actions { right: max(16px, env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 8px 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); white-space: nowrap; }
.btn:hover { border-color: rgba(190, 200, 255, .35); }
.btn[aria-pressed="true"] { border-color: var(--research); color: var(--research); }
.btn.primary { background: var(--ink); color: var(--space); border-color: var(--ink); font-weight: 600; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn svg { width: 15px; height: 15px; }

.capture { left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(640px, calc(100vw - 32px)); border-radius: 16px; padding: 8px; display: grid; gap: 6px; z-index: 7; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
.capture-row { display: flex; gap: 8px; align-items: flex-end; }
.capture textarea { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; padding: 8px 6px; max-height: 140px; outline: none; line-height: 1.45; font-size: 15px; }
.capture textarea::placeholder { color: var(--muted); }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex: none; }
.modes button { border: 0; background: none; padding: 6px 10px; font-size: 12px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--hover); color: var(--ink); font-weight: 600; }
.send { width: 38px; height: 38px; border-radius: 10px; border: 0; background: var(--ink); color: var(--space); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .4; cursor: default; }
.send svg { width: 17px; height: 17px; }
.capture-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 4px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.mic-tip { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12px; display: inline-flex; gap: 5px; align-items: center; }
.mic-tip:hover { color: var(--ink); }
.mic-tip.live, .send.mic.live { color: var(--learn); }
.send.mic { background: rgba(255, 122, 89, .16); color: var(--learn); border: 1px solid rgba(255, 122, 89, .4); }
.send.mic.live { background: var(--learn); color: var(--space); animation: talkpulse .6s ease-in-out infinite alternate; }
.mic-tip svg { width: 14px; height: 14px; }

.drawer { position: fixed; z-index: 6; top: calc(70px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 32px)); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; gap: 10px; }
.kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--c); }
.x { border: 0; background: none; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.x:hover { background: var(--hover); color: var(--ink); }
.x svg { width: 16px; height: 16px; }
.drawer-body { padding: 8px 16px 18px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.drawer h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; letter-spacing: -.02em; line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.drawer p { margin: 0; color: var(--soft); overflow-wrap: anywhere; white-space: pre-wrap; }
.drawer ul.det { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--soft); }
.drawer code { font-family: var(--font-mono); font-size: 12px; background: var(--hover); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.edit-title { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: -.02em; background: transparent; border: 0; border-bottom: 1px dashed var(--line); padding: 2px 0 6px; width: 100%; outline: none; }
.edit-title:focus { border-bottom-color: var(--focus); }
.edit-body { min-height: 150px; resize: vertical; width: 100%; background: rgba(160, 180, 255, .05); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; line-height: 1.55; color: var(--soft); }
.meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.sec { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: rgba(160, 180, 255, .05); border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 13px; max-width: 100%; }
.chip span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { border-color: var(--c); }
.chip .dot { width: 7px; height: 7px; }
.chip .rm { border: 0; background: none; padding: 0 0 0 2px; color: var(--muted); font-size: 14px; line-height: 1; }
.tag { font-family: var(--font-mono); font-size: 12px; color: var(--research); background: rgba(95, 214, 255, .1); border-radius: 5px; padding: 1px 6px; }
.extlink { color: var(--focus); }
.danger { border: 0; background: none; color: var(--prefs); padding: 0; font-size: 13px; justify-self: start; }
.input { width: 100%; background: rgba(160, 180, 255, .06); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.toolrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spark { color: var(--research); }
.suggest-card { border: 1px solid rgba(95, 214, 255, .35); background: rgba(95, 214, 255, .06); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.suggest-card .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--research); }
.sg-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13.5px; }
.sg-row small { display: block; color: var(--muted); font-size: 12px; }
.sg-row b { font-weight: 600; color: var(--ink); }
.details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.details label { display: grid; gap: 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; min-width: 0; }
.details .input { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 13px; padding: 6px 8px; color: var(--ink); }
.details label.full { grid-column: 1 / -1; }
.why { font-size: 12px; color: var(--muted); margin: -2px 0 0 2px; }
.hist { display: grid; gap: 4px; }
.hist-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; padding: 6px 8px; border-radius: 8px; background: rgba(160, 180, 255, .05); }
.hist-row span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--soft); }
.hist-row small { color: var(--muted); font-family: var(--font-mono); font-size: 11px; white-space: nowrap; }
.set-block { display: grid; gap: 8px; padding: 10px 9px 14px; border-bottom: 1px solid var(--line); }
.set-block:last-child { border-bottom: 0; }
.set-block b { font-weight: 600; }
.set-block p { margin: 0; color: var(--muted); font-size: 13px; }
.statchip { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.statchip.verified { color: var(--skills); border-color: rgba(111, 240, 194, .4); }

    { id: "artifacts", c: "tools", t: "Claude artifacts", d: "2026-10-15", s: "Web pages Claude publishes for me. They can save data to my account and ask Claude questions, so they work like real apps.", x: ["Daybook and this Second Brain are artifacts", "Private by default; I choose who to share with"], l: [] },
    { id: "anthropic-api", c: "tools", t: "Anthropic API key", d: "2026-10-16", s: "Pay-as-you-go access to Claude for my own tools, from console.anthropic.com.", x: ["Separate from the Claude Pro plan", "Add credit under Billing, create a key under API Keys", "The key is shown once: copy it and keep it secret"], l: ["keys-secret"] },
    { id: "cloud-sessions", c: "tools", t: "Claude Code in the cloud", d: "2026-10-15", s: "Sessions run in a temporary container that is deleted afterwards, so work has to be pushed to GitHub to last.", x: ["Select the setup repo plus the project repo when starting a session"], l: ["github", "mcp-scopes", "auto-save"] },
    { id: "dictation", c: "tools", t: "Voice dictation", d: "2026-10-16", s: "Talk instead of typing in any text box: iPhone keyboard mic, or press Fn twice (or the mic key) on a Mac.", x: [], l: [] },
    { id: "api-vs-scraping", c: "lessons", t: "API vs scraping", d: "2026-10-16", s: "An API is a service's official way to hand data to a program. Scraping copies what a page shows when there's no API.", x: ["Always try an API first: cleaner, faster, allowed"], l: ["free-first"] },
    { id: "scraping-rules", c: "lessons", t: "Scrape politely", d: "2026-10-16", s: "Public pages only, check robots.txt and the terms, go slowly, and never get around CAPTCHAs or logins.", x: [], l: [] },
    { id: "keys-secret", c: "lessons", t: "Keep keys secret", d: "2026-10-16", s: "API keys never go in code or GitHub. Use environment variables or a .env file listed in .gitignore.", x: [], l: [] },
    { id: "ban-risk", c: "lessons", t: "Ban risk", d: "2026-10-16", s: "Paid API keys are safe. Logging subscriptions into third-party tools, stacking free accounts or using stealth features gets accounts banned.", x: [], l: ["free-first"] },
    { id: "eacces", c: "lessons", t: "Permission denied (EACCES)", d: "2026-10-16", s: "If npm says EACCES on a Mac, the install needs admin rights: put sudo in front and type the Mac password.", x: ["Nothing shows while you type the password; that's normal"], l: [] },
    { id: "mcp-scopes", c: "lessons", t: "MCP servers & .mcp.json", d: "2026-10-15", s: "MCP servers give Claude new tools. --scope project saves them in .mcp.json so they come with the repo.", x: ["New servers load when a session starts"], l: [] },
    { id: "github-app", c: "lessons", t: "Claude GitHub App", d: "2026-10-16", s: "Linking GitHub isn't enough: the Claude GitHub App must be installed on my account with access to the repo before Claude can push.", x: ["github.com/apps/claude/installations/select_target"], l: [] },
    { id: "alarms-open", c: "lessons", t: "Web alarms need an open tab", d: "2026-10-15", s: "A web page can't wake my phone when closed, so Daybook alarms ring only while it's open.", x: [], l: [] },
    { id: "transcripts", c: "lessons", t: "Claude reads, it doesn't watch", d: "2026-10-16", s: "Claude can't watch videos, but it can read a video's transcript and reference it.", x: [], l: [] },
    { id: "priorities", c: "lessons", t: "Must / Should / Could", d: "2026-10-15", s: "Sort tasks by how much they matter today; keep Must-dos to three.", x: [], l: [] },
    { id: "pomodoro", c: "lessons", t: "Focus sessions", d: "2026-10-15", s: "Work in 25-minute blocks with 5-minute breaks, and a long break after every fourth.", x: [], l: [] },
    { id: "goal-tracking", c: "lessons", t: "Goals need dates & steps", d: "2026-10-15", s: "A goal becomes trackable with a target date and milestones, so progress can be compared to time passed.", x: [], l: ["priorities"] },
    { id: "claude-md", c: "lessons", t: "CLAUDE.md", d: "2026-10-16", s: "A file of standing instructions that loads at the start of every Claude Code session in that repo. Keep it short; put know-how in skills.", x: [], l: ["mcp-scopes"] }, { id: "ai-os", c: "systems", t: "My AI operating system", d: "2026-10-17", s: "Memory map (memory/README.md), decisions log, one file per project with the next step, context file for ChatGPT, and 3 sharp skills: personal-intelligence, full-stack-dev, reviewer. Few skills, good memory, verification.", x: [], l: ["claude-md"] },
    { id: "claude-memory", c: "lessons", t: "How Claude remembers", d: "2026-10-16", s: "Claude starts every chat with a blank memory. It only \"learns\" what we save into CLAUDE.md and skills, so saving is how I train it.", x: ["Better, not just bigger: short rules in CLAUDE.md, know-how in skills"], l: ["claude-md"] },
    { id: "auto-save", c: "lessons", t: "Save every session", d: "2026-10-16", s: "At the end of each session Claude saves what we built and learned to the setup repo and pushes it, so nothing is lost.", x: [], l: ["claude-memory"] },
    { id: "second-brain-apps", c: "research", t: "Second-brain apps", d: "2026-10-16", s: "Obsidian (graph view, backlinks), Logseq (free, daily journals), Reflect (daily notes, encryption), Mem (AI files notes for you), Notion (all-in-one for teams).", x: ["The big split: apps you organize by hand vs apps that organize themselves"], l: [] },
    { id: "plain-language", c: "prefs", t: "Explain everything, simply", d: "2026-10-16", s: "Adult learner (20), basics known, going from basic to intermediate: compact, useful, no hand-holding; give exact steps when building.", x: [], l: ["claude-md"] },
    { id: "show-results", c: "prefs", t: "Show me the result", d: "2026-10-16", s: "When something is built, show a link or screenshot instead of describing it.", x: [], l: ["claude-md"] },
    { id: "ask-before", c: "prefs", t: "Ask before deleting", d: "2026-10-16", s: "Nothing gets deleted without asking first. Saving to the setup repo happens automatically.", x: [], l: ["claude-md", "github"] },
    { id: "free-first", c: "prefs", t: "Free first", d: "2026-10-16", s: "Prefer free tools and tiers, as long as they're safe and allowed.", x: [], l: [] },
    // From my Obsidian vault in Google Drive (2026-10-15)
    { id: "guidify", c: "projects", t: "Guidify", d: "2026-10-15", s: "My Instagram page and brand (Guidify LLC). 2026 goal: grow it into a real brand.",
      x: ["Content pipeline: idea → format (Reel / Post / Story) → post date", "Track followers and best posts", "Learning focus: branding"], l: ["mission", "goals-2026", "brand-guidify", "ai-business", "learning-areas"] },
    { id: "investedia", c: "projects", t: "Investedia", d: "2026-10-15", s: "My investment agency: \"We teach, inspire, and guide you to invest smarter.\" 2026 goal: get its first clients.",
      x: ["Clients & leads pipeline: Lead → Call → Client", "Instagram highlights plan: About, Tips, POV / Case study, Learn", "Learning focus: investing"], l: ["mission", "goals-2026", "brand-investedia", "ai-business", "learning-areas"] },
    { id: "obsidian-vault", c: "tools", t: "My Obsidian vault", d: "2026-10-15", s: "My second brain in Google Drive: Home dashboard, Inbox, Projects, Planning, Calendar, Journal and a Brain Map canvas.",
      x: ["Daily notes: morning intention, Top 3, time blocks, habits, log, evening reflection", "Weekly review on Sunday, monthly scorecard"], l: ["second-brain", "habits-rule", "daily-loop"] },
    { id: "habits-rule", c: "prefs", t: "Never miss twice", d: "2026-10-15", s: "My habits: plan the day (Top 3), one deep-work block, move my body, read or learn 20 min, evening reflection. A missed day is fine; two in a row is a new habit.", x: [], l: ["priorities", "pomodoro"] },
    { id: "daily-loop", c: "prefs", t: "My daily loop", d: "2026-10-15", s: "Morning: set an intention and Top 3. During the day: log what happens. Evening: what went well, what didn't, one lesson, energy /10, tomorrow's #1.", x: [], l: ["habits-rule"] },
    { id: "learning-areas", c: "prefs", t: "What I'm learning", d: "2026-10-15", s: "Branding (for Guidify), investing (for Investedia), and web and app building with AI.", x: [], l: ["learn-path"] },
    { id: "voice-style", c: "prefs", t: "How I write to Claude", d: "2026-10-17", s: "I often talk instead of type, so names can come out wrong (\"Visidia\" = Investedia). Read my messages generously, confirm names, and give me the big picture plus the next step.", x: [], l: ["plain-language", "dictation"] },
    // Learn AI course
    { id: "learn-path", c: "learn", step: 0, t: "Start here: your AI path", d: "2026-10-17", s: "A step-by-step course from \"what is AI\" to building your own tools. Tick each step when it clicks, and press \"Teach me\" for a mini lesson.", x: [], l: ["ai-basics"] },
    { id: "ai-basics", c: "learn", step: 1, t: "What an AI model is", d: "2026-10-17", s: "A large language model (LLM) like Claude learned patterns from huge amounts of text. It predicts helpful next words, which lets it explain, write, plan and code. It doesn't look things up unless it's given a tool to.", x: [], l: ["tokens"] },
    { id: "tokens", c: "learn", step: 2, t: "Tokens & context window", d: "2026-10-17", s: "AI reads text in small pieces called tokens (about ¾ of a word). The context window is how much it can read at once: your messages, files and its replies. Long chats fill it up, so start fresh chats for new topics.", x: [], l: ["prompting"] },
    { id: "prompting", c: "learn", step: 3, t: "Prompting basics", d: "2026-10-17", s: "Say the goal, give context (who it's for, what you have), show an example, and say the format you want. \"Write 3 Instagram captions for Guidify about saving money, friendly tone, max 2 lines each\" beats \"write captions\".", x: [], l: ["claude-models"] },
    { id: "claude-models", c: "learn", step: 4, t: "Claude's models", d: "2026-10-17", s: "Claude comes in sizes: Haiku (fastest, cheapest), Sonnet (balanced), Opus (most capable). Use bigger models for hard thinking and coding, smaller ones for quick simple jobs.", x: [], l: ["claude-apps"] },
    { id: "claude-apps", c: "learn", step: 5, t: "Ways to use Claude", d: "2026-10-17", s: "claude.ai and the apps for chatting (with Projects to keep files together), voice mode in the mobile app for talking out loud, artifacts for apps like this one, and Claude Code for building software.", x: [], l: ["claude-code-learn", "artifacts"] },
    { id: "claude-code-learn", c: "learn", step: 6, t: "Claude Code", d: "2026-10-17", s: "Claude working as an agent on real files: it reads code, runs commands, builds, tests and pushes to GitHub. CLAUDE.md and skills make it remember you.", x: [], l: ["agents", "claude-md", "cloud-sessions"] },
    { id: "agents", c: "learn", step: 7, t: "Agents & tools", d: "2026-10-17", s: "An agent is an AI that can take actions, not just talk: search the web, open a browser, edit files. Tools are the abilities you give it. MCP is a standard way to plug new tools in.", x: [], l: ["mcp-scopes", "playwright"] },
    { id: "skills-learn", c: "learn", step: 8, t: "Skills: teach Claude once", d: "2026-10-17", s: "A skill is a written playbook Claude opens when a task matches it. Write how you want something done once, and it's done that way every time.", x: [], l: ["daily-plan", "web-data", "video-notes"] },
    { id: "hallucinations", c: "learn", step: 9, t: "Check the facts", d: "2026-10-17", s: "AI can sound sure and still be wrong (a \"hallucination\"). For numbers, prices, laws and investing facts, ask for sources and double-check. Very important for Investedia.", x: [], l: ["investedia"] },
    { id: "rag", c: "learn", step: 10, t: "Giving AI your own knowledge", d: "2026-10-17", s: "AI doesn't know your notes unless you give them to it. Apps like this one find your most relevant notes and hand them to Claude with your question. That's called RAG (retrieval-augmented generation).", x: [], l: ["second-brain"] },
    { id: "api-learn", c: "learn", step: 11, t: "APIs: AI inside your own apps", d: "2026-10-17", s: "With an API key, your own code can send Claude a message and get an answer back. That's how you'd build an AI feature into a website for Guidify or Investedia.", x: [], l: ["anthropic-api", "api-vs-scraping", "keys-secret"] },
    { id: "ai-business", c: "learn", step: 12, t: "AI for my businesses", d: "2026-10-17", s: "Guidify: content ideas, captions, scripts for Reels, posting plans. Investedia: explain investing simply, draft client emails, research (fact-checked). Always add your own voice and check the facts.", x: [], l: ["guidify", "investedia", "hallucinations"] },
    { id: "ai-privacy", c: "learn", step: 13, t: "Safety & privacy", d: "2026-10-17", s: "Don't paste passwords, API keys or clients' private details into chats. Keep repos with personal info private. Read what an AI wants to run before saying yes.", x: [], l: ["keys-secret", "ban-risk"] },
    { id: "ai-habit", c: "learn", step: 14, t: "Make it a daily habit", d: "2026-10-17", s: "Use your 20-minute learning habit: one step from this path, one small experiment, then save what you learned here. Small daily reps beat big weekend sessions.", x: [], l: ["habits-rule", "learning-areas"] },
    // Brand & assets: drafts found in Google Drive, waiting for confirmation
    { id: "brand-guidify", c: "brand", draft: true, t: "Guidify brand files", d: "2026-10-17", s: "Waiting for your Guidify pictures and logo. The Drive folder \"@ Guidify LLC / Guidify\" is empty, so send them in the chat or drop them in that folder, then confirm which ones are yours.", x: [], l: [] },
    { id: "brand-investedia", c: "brand", t: "Investedia brand kit", d: "2026-10-17", s: "25 assets built from the logo on investedia.com: logos, profile pictures, app icon and favicon, LinkedIn / X / YouTube banners, website share image, 5 Instagram highlight covers, 4 post templates, a story template and a guidelines sheet. PNG + SVG.",
      x: ["Colors: Ink #0A0A0B, Carbon #1E1E21, Amber #FEA501, White, Mist #D4D4D8", "Type: Poppins SemiBold headlines, Poppins / Inter body", "Saved in Drive: @ Guidify LLC / Investedia / Brand kit"], url: "https://claude.ai/artifact/CZhqQatKudTSVtbeKQSKYp", l: ["investedia", "brand-colors", "drive-brand-folder", "ai-business"] },
    { id: "brand-colors", c: "brand", t: "Investedia colors & type", d: "2026-10-17", s: "Black (Ink) background, a rising Amber chart line over a Carbon area, white Poppins wordmark with an amber dot on the i.", x: ["Keep the amber dot on the i", "White logo on dark, black logo on white", "Mark example numbers as examples: not financial advice"], l: [] },
    { id: "drive-brand-folder", c: "tools", t: "Brand kit in Google Drive", d: "2026-10-17", s: "@ Guidify LLC / Investedia / Brand kit. Icon, app icon, favicon and profile picture are in; the brand kit page's \"Save all to Google Drive\" button adds the rest.", x: [], l: ["obsidian-vault"] },
    // Systems: repeatable workflows (files in systems/ in the setup repo)
    { id: "sys-brand-kit", c: "systems", t: "System: brand kit", d: "2026-10-17", s: "Roles: brand designer, researcher, file organizer. Find the real logo → sample colors and font → generate SVG kit → render PNGs and check → brand kit page → sync everything.", x: ["Say: \"make a brand kit for <brand>\"", "Last run: Investedia, 25 assets"], url: "https://github.com/hellaynr1/Claude2/blob/main/systems/brand-kit.md", l: ["brand-investedia", "sys-sync", "web-data"] },
    { id: "sys-build-app", c: "systems", t: "System: build an app", d: "2026-10-17", s: "Roles: product designer, developer, tester. Goal + features → design tokens → build → browser test (desktop + phone, AI stand-in) → screenshot check → publish same link → sync.", x: ["Say: \"build me an app\" or \"add <feature> to <app>\""], url: "https://github.com/hellaynr1/Claude2/blob/main/systems/build-app.md", l: ["daybook", "second-brain", "sys-sync", "artifacts"] },
    { id: "sys-sync", c: "systems", t: "System: sync everything", d: "2026-10-17", s: "Role: archivist. After any change: update galaxy stars, put files in the right Drive folder, save to the repo with a log entry, push, report in one line.", x: ["Runs automatically after every build"], url: "https://github.com/hellaynr1/Claude2/blob/main/systems/sync-everything.md", l: ["sync-rule", "auto-save", "drive-brand-folder"] },
    { id: "sys-research", c: "systems", t: "System: research to brain", d: "2026-10-17", s: "Roles: researcher, teacher. Search good sources → explain simply with links → save as a Research star or vault note.", x: ["Say: \"research <question>\""], url: "https://github.com/hellaynr1/Claude2/blob/main/systems/research-to-brain.md", l: ["second-brain-apps", "video-notes"] },
    { id: "sys-how", c: "systems", t: "How systems work", d: "2026-10-17", s: "Give Claude roles, a combination of skills and steps, or say \"save this as a system\" after a task you liked. It's saved as a file, a star here and a note in your vault. Say \"run the <name> system\" to repeat it.", x: [], l: ["skills-learn", "sys-sync"] },
    { id: "sys-optimizer", c: "systems", t: "System: daily optimizer", d: "2026-10-17", s: "A Claude session that runs on its own every day at 20:45 (Brussels): reads the brain log and setup repo, studies what worked, and drafts improvements to CLAUDE.md, skills, systems and the galaxy. It only proposes: changes arrive as a GitHub pull request with a phone notification. Merge = approve, close = reject.", x: ["On since 2026-10-17 · first run tonight", "Can't read Google Drive yet (no connectors on the scheduled task)"], url: "https://github.com/hellaynr1/Claude2/blob/main/systems/weekly-optimizer.md", l: ["remote-automation", "sys-sync", "claude-memory"] },
    { id: "remote-automation", c: "learn", step: 15, t: "Remote automation", d: "2026-10-17", s: "Claude Code can run in the cloud on a schedule, without you at the computer. Safe setup: it researches and prepares, then asks you to approve before anything changes. Pull requests are the approval button: read, then merge to approve or close to reject.", x: [], l: ["sys-optimizer", "claude-code-learn", "agents"] },
    { id: "claude-projects", c: "learn", step: 16, t: "Projects: give Claude context", d: "2026-10-17", s: "In claude.ai, a Project keeps files and instructions together, so every chat in it already knows your business. Put your brand guide and goals in a Guidify Project once, and stop repeating yourself.", x: [], l: [] },
    { id: "system-prompts", c: "learn", step: 17, t: "Instructions Claude follows", d: "2026-10-17", s: "Standing instructions (a system prompt, Project instructions or CLAUDE.md) tell Claude who it is and how to answer, before you ask anything. Short, specific rules beat long essays.", x: [], l: [] },
    { id: "structured-output", c: "learn", step: 18, t: "Asking for tables, lists & checklists", d: "2026-10-17", s: "Say the exact format: \"a table with columns Idea, Format, Hook\" or \"a checklist of 5 steps\". Clear formats make answers easy to copy into Notion, Canva or a spreadsheet.", x: [], l: [] },
    { id: "iterating", c: "learn", step: 19, t: "Improve answers step by step", d: "2026-10-17", s: "Great results come from rounds: ask, look, then say what to change (\"shorter\", \"more casual\", \"add a hook\"). Treat Claude like a teammate you give feedback to.", x: [], l: [] },
    { id: "web-basics", c: "learn", step: 20, t: "HTML, CSS & JavaScript in one minute", d: "2026-10-17", s: "Every website is three layers: HTML is the content (text, buttons), CSS is the look (colors, fonts), JavaScript is the behavior (what happens when you tap). Your Second Brain is all three in one file.", x: [], l: [] },
    { id: "git-basics", c: "learn", step: 21, t: "Git & GitHub: save points for code", d: "2026-10-17", s: "Git saves versions of your files (commits). GitHub stores them online. Push uploads your commits; a pull request proposes changes someone approves. Your Claude2 repo uses all of this.", x: [], l: [] },
    { id: "free-hosting", c: "learn", step: 22, t: "Putting a website online for free", d: "2026-10-17", s: "Static sites (just files, no server) can be hosted free on GitHub Pages, Netlify or Vercel. The Second Brain web app runs this way: files on GitHub, opened in any browser.", x: [], l: [] },
    { id: "databases", c: "learn", step: 23, t: "Databases: where apps keep data", d: "2026-10-17", s: "A database stores data so it survives refreshes and works on every device. Your app now keeps notes in your browser and syncs a copy to your Puter account; a real database like Supabase is the next level.", x: [], l: [] },
    { id: "automations", c: "learn", step: 24, t: "Automations & webhooks", d: "2026-10-17", s: "An automation runs steps for you when something happens: a new form entry → add to a sheet → send an email. Tools like Zapier, Make or n8n connect apps; a webhook is the \"something happened\" message between them.", x: [], l: [] },
    { id: "voice-ai", c: "learn", step: 25, t: "Voice in apps: speech to text & back", d: "2026-10-17", s: "Speech-to-text turns your voice into words (your phone's dictation); text-to-speech reads words aloud. Talk mode chains them with Claude: you speak → text → Claude → spoken answer.", x: [], l: [] },
    { id: "ai-content", c: "learn", step: 26, t: "An AI content workflow for Instagram", d: "2026-10-17", s: "Pick a theme → ask Claude for 10 ideas → choose 3 → have it draft hooks, captions and Reel scripts → edit in your voice → design in Canva with your brand kit → post and track results.", x: [], l: [] },
    { id: "hooks-captions", c: "learn", step: 27, t: "Hooks & captions that stop the scroll", d: "2026-10-17", s: "The first line decides if people keep reading. Ask Claude for 10 hook styles (question, bold claim, POV, number), test them, and keep notes on which work for your audience.", x: [], l: [] },
    { id: "ai-messages", c: "learn", step: 28, t: "AI for emails, DMs & client replies", d: "2026-10-17", s: "Give Claude the situation, your goal and your tone, then ask for a short reply. Always read before sending, never paste clients' private details, and keep your own voice.", x: [], l: [] },
    { id: "ai-research", c: "learn", step: 29, t: "Research & competitor analysis", d: "2026-10-17", s: "Ask Claude to compare competitors on price, offer and content style, then verify with real sources. Use it to find gaps: what your audience asks that nobody answers well.", x: [], l: [] },
    { id: "metrics", c: "learn", step: 30, t: "Measuring what works", d: "2026-10-17", s: "Track a few numbers weekly: followers, saves, shares, link clicks, leads. Ask Claude to spot patterns in your numbers, then double down on what works.", x: [], l: [] },
    { id: "embeddings", c: "learn", step: 31, t: "Embeddings & smarter search", d: "2026-10-17", s: "Embeddings turn text into numbers that capture meaning, so search can find \"cash flow\" when you typed \"money coming in\". It's the next upgrade for searching your Second Brain.", x: [], l: [] },
    { id: "build-agent", c: "learn", step: 32, t: "Building your own AI agent", d: "2026-10-17", s: "An agent = a model + tools + a loop: it decides which tool to use, sees the result, and continues until done. Start tiny: one tool, one clear job, a human approving actions.", x: [], l: [] },
    { id: "evals", c: "learn", step: 33, t: "Testing AI answers (evals)", d: "2026-10-17", s: "To know if a prompt got better, test it on the same 10 to 20 examples every time and score the answers. Gut feeling isn't enough once real customers see the results.", x: [], l: [] },
    { id: "token-costs", c: "learn", step: 34, t: "Costs & token efficiency", d: "2026-10-17", s: "You pay per token in and out. Send only the context that's needed, use smaller models for simple jobs, and keep chats focused. Your Talk mode uses the cheapest model for this reason.", x: [], l: [] },
    { id: "ai-ethics", c: "learn", step: 35, t: "Honest AI in marketing & finance", d: "2026-10-17", s: "Label AI-made images when it matters, never fake results or reviews, and for investing content always add \"not financial advice\" and check facts. Trust is your brand's biggest asset.", x: [], l: [] },
    { id: "sb-plan", c: "projects", t: "Second Brain: audit & plan", d: "2026-10-17", s: "Plan to grow the Second Brain into a real app: one database as the source of truth (Supabase), a Next.js web app with the galaxy, Ask with real search, a memory API + MCP server so Claude and ChatGPT share the same knowledge, nightly review with approvals, Drive backups.", x: ["M1 done (2026-10-17): export/import, Google Drive backup, AI suggestions you approve, type/status/importance/project fields, version history, better Ask search", "Free route: keep AI inside the Claude page (included in the plan); free Supabase + Vercel later for shared memory", "Next: M2 free shared-memory foundation"], url: "https://github.com/hellaynr1/Claude2/blob/main/docs/second-brain-plan.md", l: ["second-brain", "sys-optimizer", "rag", "api-learn", "mcp-scopes"] },
    { id: "sync-rule", c: "prefs", t: "Everything in sync", d: "2026-10-17", s: "Whenever Claude builds or changes something, it updates the Second Brain, Google Drive and the GitHub setup repo at the same time.", x: [], l: ["auto-save", "drive-brand-folder"] },
